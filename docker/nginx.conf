server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # CSV exports are posted as JSON to the tax endpoint.
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # PWA « PyTrading ». Pas d'add_header ici : il annulerait les en-têtes de
    # sécurité hérités du bloc server.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }
    location = /sw.js {
        expires -1;   # Cache-Control: no-cache — une nouvelle version est vue tout de suite
    }

    location / {
        try_files $uri /index.html;
    }
}
