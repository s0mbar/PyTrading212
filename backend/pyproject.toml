[project]
name = "pytrading212-backend"
version = "0.1.0"
description = "Backend FastAPI pour Trading 212"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.11.0",
  "uvicorn[standard]>=0.35.0"
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.13.0"
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
